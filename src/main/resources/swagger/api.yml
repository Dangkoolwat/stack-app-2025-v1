# API-first development with OpenAPI
# This file will be used at compile time to generate Spring-MVC endpoint stubs using openapi-generator
openapi: '3.0.1'
info:
  title: 'Stack App 2025 REST API'
  version: 0.0.1
  description: >
    Spring Boot 3.5.x / API-first 개발 명세.
    JWT 인증과 RFC7807 오류 응답을 지원합니다.
  contact:
    name: Stack API Support
    email: support@stackapp.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8080/api
    description: Local Development server
  - url: https://localhost:8443/api
    description: Local Development server with TLS
  - url: https://api.stackapp.com
    description: Production server

paths:
  /hello:
    get:
      summary: Hello API
      description: 간단한 인사 메시지를 반환합니다.
      operationId: getHello
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelloResponse'
        default:
          $ref: '#/components/responses/Problem'

  /auth/login:
    post:
      summary: User login
      description: 사용자 로그인을 처리하고 JWT 토큰을 반환합니다.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 (JWT 반환)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 인증 실패
          content:
            application/problem+json:
              schema:
                $ref: '#/components/responses/Problem'
      security: []   # 로그인 API는 인증 불필요

  /users/me:
    get:
      summary: Get current user profile
      description: 현재 로그인한 사용자의 프로필 정보를 반환합니다.
      operationId: getCurrentUser
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        default:
          $ref: '#/components/responses/Problem'

components:
  schemas:
    HelloResponse:
      type: object
      properties:
        message:
          type: string
          example: Hello, Stack App 2025!

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: user
        password:
          type: string
          example: pass123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: user
        email:
          type: string
          example: user@example.com
        roles:
          type: array
          items:
            type: string
          example: [ "ROLE_USER" ]

  responses:
    Problem:
      description: RFC7807 표준 오류 응답
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type:
                type: string
                format: uri
                description: 문제 유형 식별자
                example: "https://stack-app.com/probs/auth"
              title:
                type: string
                description: 문제 요약
                example: "Unauthorized"
              status:
                type: integer
                format: int32
                description: HTTP 상태 코드
                example: 401
              detail:
                type: string
                description: 오류 상세 설명
                example: "Full authentication is required to access this resource"
              instance:
                type: string
                format: uri
                description: 요청 경로
                example: "/api/account"
              properties:
                type: object
                description: 확장 필드 (timestamp, path, errors 등)
                properties:
                  timestamp:
                    type: string
                    format: date-time
                    example: "2025-10-01T18:20:00+09:00"
                  path:
                    type: string
                    example: "/api/account"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        objectName:
                          type: string
                          example: "User"
                        field:
                          type: string
                          example: "email"
                        message:
                          type: string
                          example: "must not be blank"

  securitySchemes:
    jwt:
      type: http
      description: JWT Authentication
      scheme: bearer
      bearerFormat: JWT

security:
  - jwt: []
