# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
          - caches
          - liquibase
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
    jhimetrics:
      access: read-only
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false # http://localhost:4318/v1/metrics  전송 중지
spring:
  application:
    name: stack
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - dev
#        - secret
        - local-tls
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- data      -
  threads:
    virtual:
      enabled: true # SimpleAsyncTaskExecutor 사용
  jmx:
    enabled: false
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: true
      hibernate.cache.use_query_cache: true
      hibernate.generate_statistics: true
      # modify batch size as necessary
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # modify fetch size as necessary
      hibernate.jdbc.fetch_size: 150
      hibernate.criteria.literal_handling_mode: BIND
      hibernate.query.fail_on_pagination_over_collection_fetch: true
      hibernate.query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none
      naming:
#       physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
#       physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        physical-strategy: com.daangcool.stack.config.OracleCaseInsensitiveNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  main:
    allow-bean-definition-overriding: false # Springboot 4 default value
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: stack-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: stack-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true
  liquibase:
    change-log: classpath:config/liquibase/master.xml

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true
  api-docs:
    path: /api-docs          # OpenAPI JSON 문서 엔드포인트
    enabled: true
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html   # Swagger UI 접근 경로
    operations-sorter: method
    tags-sorter: alpha
    tryItOutEnabled: true
    display-request-duration: true
# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'stackApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: stack@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: Stack API
    description: Stack API documentation
    version: 1.0.0
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
    content-security-policy: "default-src 'self'; frame-src 'self' data:; script-src 'self' https://storage.googleapis.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    # style-src의 'unsafe-inline'은 Vue/CSS-in-JS 런타임 주입에 필요할 수 있습니다.
    # 제거하려면 프론트엔드에서 nonce 또는 hash 기반 CSP 적용이 필요합니다.
    # script-src에서는 'unsafe-inline'을 제거하여 XSS 공격 표면을 줄였습니다.

# jhipster-needle-add-application-yaml-document
---
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
    rate-limit:
        redis-server: ${APPLICATION_RATE_LIMIT_REDIS_SERVER:} # 분산 환경 사용 시 기입 (예: redis://localhost:6379), 비어 있으면 기본 RedissonClient 재사용
        cluster: ${APPLICATION_RATE_LIMIT_REDIS_CLUSTER:false}
        authenticate:
            tokens: 10
            duration-minutes: 5
        register:
            tokens: 5
            duration-minutes: 30
        reset-password-init:
            tokens: 3
            duration-minutes: 15
        otp-request:
            tokens: 5
            duration-minutes: 10
        otp-verify:
            tokens: 10
            duration-minutes: 10
