# ===================================================================
# Spring Boot configuration for the "dev" profile.
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    com.daangcool.stack: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: DEBUG

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false
  jackson:
    serialization:
      indent-output: true

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # ---------------------------------------------------------------
      # 풀 이름 — 모니터링 / 로그에서 풀을 식별합니다
      # ---------------------------------------------------------------
      pool-name: HikariPool-Dev

      # ---------------------------------------------------------------
      # 트랜잭션 자동 커밋 — JPA/Hibernate가 직접 제어하므로 반드시 false
      # ---------------------------------------------------------------
      auto-commit: false

      # ---------------------------------------------------------------
      # 풀 크기 — dev 환경은 소규모로 유지
      # 공식: (CPU코어 × 2) + 스핀들 수
      # dev 는 로컬 개발용이므로 최소로 설정
      # ---------------------------------------------------------------
      maximum-pool-size: 10      # 개발 환경 최대 연결 수
      minimum-idle: 2            # 유휴 상태로 유지할 최소 연결 수
                                 # (HikariCP 권고: pool 크기와 동일하게 하면
                                 #  fixed-size pool 이 되어 성능이 더 안정적)

      # ---------------------------------------------------------------
      # 연결 타임아웃 — getConnection() 호출 후 풀에서 연결을 기다리는 최대 시간
      # 초과 시 SQLException 발생
      # 권장: 30초 (운영에서는 10~20초로 낮춰 빠른 장애 감지)
      # ---------------------------------------------------------------
      connection-timeout: 30000  # 30초 (ms)

      # ---------------------------------------------------------------
      # 유휴 타임아웃 — minimum-idle < maximum-pool-size 일 때만 동작
      # 초과 유휴 연결을 풀에서 제거하는 시간
      # Oracle IDLE_TIME profile 값보다 짧게 설정 필수
      # 권장: 10분
      # ---------------------------------------------------------------
      idle-timeout: 600000       # 10분 (ms)

      # ---------------------------------------------------------------
      # 최대 수명 — 연결의 최대 사용 시간 (생성 시점 기준)
      # Oracle SQLNET.EXPIRE_TIME / 방화벽 세션 타임아웃보다 짧게 설정 필수
      # 권장: 30분 (운영 Oracle 세션 타임아웃이 보통 1시간 이상이므로 여유 확보)
      # ---------------------------------------------------------------
      max-lifetime: 1800000      # 30분 (ms)

      # ---------------------------------------------------------------
      # Keepalive — 유휴 연결에 주기적으로 ping 을 보내 Oracle 방화벽/세션 차단 방지
      # connectionTestQuery 를 실행하거나 JDBC4 isValid() 를 호출합니다
      # idle-timeout 보다 짧게 설정, keepaliveTime < idle-timeout 권장
      # Oracle 에서는 필수 — 방화벽이 INACTIVE 세션을 끊는 경우가 많음
      # ---------------------------------------------------------------
      keepalive-time: 120000     # 2분 (ms) — dev 환경에서는 짧게

      # ---------------------------------------------------------------
      # 연결 검증 쿼리 — JDBC4 드라이버(ojdbc)는 isValid() 지원이므로 생략 가능
      # ojdbc17 은 JDBC4 완전 지원 → 설정 불필요
      # 하지만 명시적으로 설정하면 isValid() 대신 이 쿼리로 검증합니다
      # ---------------------------------------------------------------
      # connection-test-query: SELECT 1 FROM DUAL  # ojdbc17 에서는 불필요

      # ---------------------------------------------------------------
      # 연결 초기화 SQL — 풀에서 새 연결 생성 직후 Oracle 세션 파라미터 고정
      # NLS_DATE_FORMAT: 날짜 직렬화 일관성 보장
      # TIME_ZONE: 애플리케이션 timezone 과 일치시켜 Instant 매핑 오류 방지
      # ---------------------------------------------------------------
      connection-init-sql: >
        ALTER SESSION SET
        NLS_DATE_FORMAT = 'YYYY-MM-DD HH24:MI:SS'
        NLS_TIMESTAMP_FORMAT = 'YYYY-MM-DD HH24:MI:SS.FF3'
        TIME_ZONE = 'Asia/Seoul'

  liquibase:
    enabled: true
    change-log: classpath:config/liquibase/master.xml
    contexts: dev
    drop-first: false

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
        generate_statistics: true
    show-sql: true

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:test@stack.local}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  messages:
    cache-duration: PT1S
  thymeleaf:
    cache: false

server:
  port: 8443
  forward-headers-strategy: native

jhipster:
  cache:
    redis:
      expiration: 3600
      server: ${application.redis.server}
      cluster: ${application.redis.cluster:false}
  cors:
    allowed-origins: 'https://localhost:3000,https://localhost:8443,http://localhost:9000,https://localhost:9000'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # [NC-1 수정] dev 전용 fallback 시크릿 — prod와 완전히 분리된 값 사용.
        # prod 환경에서는 이 값이 절대 사용되지 않습니다 (prod는 fallback 없음 → 미주입 시 시작 실패).
        # 로컬 개발 편의를 위해 fallback을 유지하되 prod 값과 다른 값으로 지정합니다.
        # 실제 JWT_SECRET 환경변수가 있으면 이 값은 무시됩니다.
        base64-secret: ${JWT_SECRET:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA}
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  mail:
    base-url: ${JHIPSTER_MAIL_BASE_URL:https://localhost:8443}
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

application:
  logging:
    file-path: ./logs/dev
    max-file-size: 5MB
    max-history: 7
    total-size-cap: 200MB
  file:
    storage-type: LOCAL
    upload-dir: /uploads
    public-path: /uploads/public
    private-path: /uploads/private
