<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>StackApp 이메일 인증번호</title>
  <style>
    body {
      font-family: "Pretendard", "Apple SD Gothic Neo", sans-serif;
      background-color: #f6f7fb;
      padding: 40px;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 480px;
      margin: auto;
    }
    .otp {
      font-size: 34px;
      color: #007BFF;
      font-weight: bold;
      letter-spacing: 6px;
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>이메일 인증번호 안내</h2>
  <p><strong th:text="${name}">사용자</strong> 님,</p>
  <p>요청하신 이메일 인증번호는 아래와 같습니다.</p>
  <p class="otp" th:text="${otpCode}">000000</p>
  <p>인증번호는 <span th:text="${ttlMinutes}">5</span>분 동안 유효합니다.</p>
  <div class="footer">
    ⓒ 2025 StackApp — This message was sent automatically.
  </div>
</div>
</body>
</html>
