# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
  application:
    name: stack
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: test
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: stack-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: stack-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'stackApp'
  mail:
    from: stack@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        base64-secret: OTM4MjFjMzMyODM1M2I3MmE3NzlmYjkxNDk0NTA2MWNjNTYxNjFmN2M3NjU3MzBmMmIwMGEyMmZjZjZiZDQ1ODIyYTUxYmY4YjlhMjlkMjYxNTBiZDZjZWJiZTAxODE1OTYyNDQ1MmM4MTc5MjgwMzc4ODBjZDgwYzk2YjAzMTk=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# application:
application:
    file:
        allowed-mime-types:
            - text/plain
            - image/jpeg
            - image/png
            - image/gif
            - application/pdf
        allowed-extensions:
            - txt
            - jpg
            - jpeg
            - png
            - gif
            - pdf
    security:
        public-paths:
            static-resources:
                - /css/**
                - /js/**
                - /images/**
                - /webjars/**
                - /favicon.ico
            i18n:
                - /content/**
                - /i18n/*
            swagger:
                - /swagger-ui.html
                - /swagger-ui/**
                - /v3/api-docs/**
                - /api-docs/**
            websocket:
                - /websocket/**
            management:
                - /management/health
                - /management/health/**
                - /management/info
    cache:
        ttl:
            default-seconds: 3600
            long-seconds: 86400
            auth-seconds: 300

management:
  health:
    mail:
      enabled: false
