services:
  mail:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP 포트 (Spring Boot에서 메일 발송할 때 사용)
      - "8025:8025"   # 웹 UI 포트 (브라우저에서 메일 확인)
    environment:
      MH_STORAGE: maildir       # (선택) 메일 저장방식, 기본은 memory
      MH_UI_BIND_ADDR: 0.0.0.0:8025
      MH_SMTP_BIND_ADDR: 0.0.0.0:1025
